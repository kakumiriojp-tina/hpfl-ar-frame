<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>仙境數位紀念品</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1a1a1a; color: white;
            font-family: sans-serif; overflow: hidden;
        }
        #login-screen {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 20px;
        }
        input {
            padding: 12px; font-size: 18px; margin-top: 15px;
            border-radius: 8px; border: none; text-align: center; width: 80%;
        }
        button.magic-btn {
            padding: 12px 24px; font-size: 18px; margin-top: 20px;
            background-color: #d4af37; color: black; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        #ar-screen {
            display: none; position: relative; width: 100%; height: 100vh; background: #000;
        }
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        #frame-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background-size: cover; background-position: center;
        }
        #capture-btn {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; background-color: rgba(255,255,255,0.8);
            border: 5px solid #d4af37; border-radius: 50%; z-index: 20; cursor: pointer;
        }
        /* 拍完照跳出來的結果畫面 */
        #result-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center;
        }
        #result-img {
            max-width: 90%; max-height: 70%;
            border: 3px solid #d4af37; border-radius: 10px;
            box-shadow: 0 0 20px rgba(212,175,55,0.6);
        }
    </style>
</head>
<body>

    <!-- 密碼畫面 -->
    <div id="login-screen">
        <h2>✨ 尋找仙境的蹤跡 ✨</h2>
        <p>請輸入通關密語來解鎖 AR 濾鏡</p>
        <input type="text" id="password" placeholder="輸入密碼..." autocomplete="off">
        <button class="magic-btn" onclick="checkPassword()">開啟濾鏡</button>
    </div>

    <!-- AR 濾鏡畫面 -->
    <div id="ar-screen">
        <video id="video" autoplay playsinline></video>
        <div id="frame-overlay"></div>
        <button id="capture-btn" onclick="takePhoto()"></button>
    </div>

    <!-- 拍照結果畫面 (用來給使用者長按儲存) -->
    <div id="result-screen">
        <p style="font-size: 16px; margin-bottom: 15px; font-weight: bold; color:#FFD700;">✨ 魔法紀錄成功！請「長按下方照片」儲存 ✨</p>
        <img id="result-img" src="" alt="仙境紀念照">
        <button class="magic-btn" onclick="closeResult()" style="margin-top: 25px; background: #fff;">返回相機重拍</button>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 我用程式碼幫你畫的「藍色邊框 + 金色星星 + HPFL2026」相框！(這招絕不會被手機擋)
        const frameDataURI = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920' viewBox='0 0 1080 1920'%3E%3Crect x='40' y='40' width='1000' height='1840' fill='none' stroke='%234DA8DA' stroke-width='30' rx='30'/%3E%3Crect x='60' y='60' width='960' height='1800' fill='none' stroke='%23FFD700' stroke-width='8' rx='20'/%3E%3Ctext x='540' y='1780' font-family='sans-serif' font-size='100' font-weight='bold' fill='%23FFD700' text-anchor='middle' letter-spacing='5'%3EHPFL 2026%3C/text%3E%3Cpath d='M 120 120 L 135 165 L 180 180 L 135 195 L 120 240 L 105 195 L 60 180 L 105 165 Z' fill='%23FFD700'/%3E%3Cpath d='M 960 1600 L 970 1630 L 1000 1640 L 970 1650 L 960 1680 L 950 1650 L 920 1640 L 950 1630 Z' fill='%23FFD700'/%3E%3C/svg%3E";

        // 把這個相框套用到畫面上
        document.getElementById('frame-overlay').style.backgroundImage = `url("${frameDataURI}")`;

        function checkPassword() {
            const pwd = document.getElementById('password').value;
            if (pwd.toUpperCase() === 'HPFL2026') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('ar-screen').style.display = 'block';
                startCamera();
            } else {
                alert('密碼錯誤！請確認通關密語喔！');
            }
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                alert('無法開啟相機，請確認有允許相機權限喔！');
            });
        }

        function takePhoto() {
            // 抓取相機實際的寬高
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // 1. 畫相機底圖
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 2. 疊加魔法圖框
            const frameImg = new Image();
            frameImg.src = frameDataURI;
            frameImg.onload = () => {
                // 將圖框滿版畫上去
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
                
                // 3. 轉成圖片並顯示在畫面上，讓使用者自己存
                document.getElementById('result-img').src = canvas.toDataURL('image/png');
                document.getElementById('result-screen').style.display = 'flex';
            };
        }

        // 關閉結果畫面
        function closeResult() {
            document.getElementById('result-screen').style.display = 'none';
        }
    </script>
</body>
</html>
